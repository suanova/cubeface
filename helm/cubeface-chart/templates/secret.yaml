{{- $mode := toString (default "postgres" .Values.database.mode) -}}
{{- $secretName := include "cubeface.secretName" . -}}
{{ if .Values.secret.create }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := dict -}}
{{- if $existing -}}
{{- range $key, $value := $existing.data -}}
{{- $_ := set $existingData $key ($value | b64dec) -}}
{{- end -}}
{{- end -}}

{{/*
Precedence: explicit values -> existing Secret (stable across upgrades) ->
generated (SESSION_SECRET only). Never generate credentials for external
services: an invented SMTP/OAuth password would be useless.
*/}}
{{- $sessionSecret := toString (default "" .Values.secrets.SESSION_SECRET) -}}
{{- if not $sessionSecret }}{{ $sessionSecret = index $existingData "SESSION_SECRET" | default "" }}{{ end -}}
{{- if not $sessionSecret }}{{ $sessionSecret = randAlphaNum 48 }}{{ end -}}

{{- $smtpPassword := toString (default "" .Values.secrets.SMTP_PASSWORD) -}}
{{- if not $smtpPassword }}{{ $smtpPassword = index $existingData "SMTP_PASSWORD" | default "" }}{{ end -}}

{{- $githubSecret := toString (default "" .Values.secrets.GITHUB_CLIENT_SECRET) -}}
{{- if not $githubSecret }}{{ $githubSecret = index $existingData "GITHUB_CLIENT_SECRET" | default "" }}{{ end -}}

{{- $googleSecret := toString (default "" .Values.secrets.GOOGLE_CLIENT_SECRET) -}}
{{- if not $googleSecret }}{{ $googleSecret = index $existingData "GOOGLE_CLIENT_SECRET" | default "" }}{{ end -}}

{{- $oidcSecret := toString (default "" .Values.secrets.OIDC_CLIENT_SECRET) -}}
{{- if not $oidcSecret }}{{ $oidcSecret = index $existingData "OIDC_CLIENT_SECRET" | default "" }}{{ end -}}

{{- $adminPassword := toString (default "" .Values.secrets.INITIAL_ADMIN_PASSWORD) -}}
{{- if not $adminPassword }}{{ $adminPassword = index $existingData "INITIAL_ADMIN_PASSWORD" | default "" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "cubeface.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_SECRET: {{ $sessionSecret | quote }}
  {{- if eq $mode "external" }}
  SQL_DSN: {{ .Values.database.external.dsn | quote }}
  {{- end }}
  SMTP_PASSWORD: {{ $smtpPassword | quote }}
  GITHUB_CLIENT_SECRET: {{ $githubSecret | quote }}
  GOOGLE_CLIENT_SECRET: {{ $googleSecret | quote }}
  OIDC_CLIENT_SECRET: {{ $oidcSecret | quote }}
  INITIAL_ADMIN_PASSWORD: {{ $adminPassword | quote }}
{{ end }}
{{- if eq $mode "postgres" }}
{{- /*
Managed PostgreSQL credentials are owned by the chart even when
secret.create=false: CloudNativePG needs the basic-auth Secret at bootstrap
time, and the app needs a DSN nobody has to assemble by hand. The password is
explicit -> existing app-auth Secret (stable across upgrades) -> generated.
*/}}
{{- $appAuthSecretName := include "cubeface.postgresAppAuthSecretName" . -}}
{{- $existingAuth := lookup "v1" "Secret" .Release.Namespace $appAuthSecretName -}}
{{- $existingPassword := "" -}}
{{- if and $existingAuth $existingAuth.data (hasKey $existingAuth.data "password") -}}
{{- $existingPassword = index $existingAuth.data "password" | b64dec -}}
{{- end -}}
{{- $postgresPassword := toString (default "" .Values.secrets.POSTGRES_PASSWORD) -}}
{{- if not $postgresPassword }}{{ $postgresPassword = $existingPassword }}{{ end -}}
{{- if not $postgresPassword }}{{ $postgresPassword = randAlphaNum 24 }}{{ end -}}
{{- include "cubeface.assertDSNSafe" (dict "value" $postgresPassword "label" "secrets.POSTGRES_PASSWORD") -}}
{{- $pgUser := toString .Values.database.postgres.auth.username -}}
{{- $pgDatabase := toString .Values.database.postgres.auth.database -}}
{{- $sqlDSN := printf "postgresql://%s:%s@%s/%s?sslmode=require" $pgUser $postgresPassword (include "cubeface.postgresAddr" .) $pgDatabase }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $appAuthSecretName }}
  labels:
    {{- include "cubeface.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ $pgUser | quote }}
  password: {{ $postgresPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cubeface.postgresDSNSecretName" . }}
  labels:
    {{- include "cubeface.labels" . | nindent 4 }}
type: Opaque
stringData:
  SQL_DSN: {{ $sqlDSN | quote }}
{{- end }}
