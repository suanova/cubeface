apiVersion: v1
kind: Service
metadata:
  name: {{ include "cubeface.fullname" . }}
  labels:
    {{- include "cubeface.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "cubeface.selectorLabels" (dict "root" . "component" "app") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
