{{- $fullname := include "cubeface.fullname" . -}}
{{- $secretName := include "cubeface.secretName" . -}}
{{- $mode := toString (default "postgres" .Values.database.mode) -}}
{{- $replicas := int (default 1 .Values.replicaCount) -}}
{{- $isSQLite := eq $mode "sqlite" -}}
{{- $isManaged := eq $mode "postgres" -}}
{{- $dsnSecretName := ternary (include "cubeface.postgresDSNSecretName" .) $secretName $isManaged -}}
{{- $waitForPostgres := and (not $isSQLite) (ternary .Values.database.postgres.waitForPostgres .Values.database.external.waitForPostgres $isManaged) -}}
{{- $waitImage := ternary .Values.database.postgres.image .Values.database.external.waitImage $isManaged -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "cubeface.labels" . | nindent 4 }}
spec:
  replicas: {{ $replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "cubeface.selectorLabels" (dict "root" . "component" "app") | nindent 6 }}
  strategy:
    {{- if $isSQLite }}
    # The SQLite file lives on a ReadWriteOnce volume: the old pod must release
    # it before the new one starts.
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "cubeface.selectorLabels" (dict "root" . "component" "app") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "cubeface.serviceAccountName" .) }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      {{- if .Values.modelLibrary.enabled }}
      # The model library reads CubeStack custom resources with this token.
      automountServiceAccountToken: true
      {{- end }}
      {{- if and .Values.podAntiAffinity (gt $replicas 1) }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "cubeface.selectorLabels" (dict "root" . "component" "app") | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $waitForPostgres }}
      initContainers:
        - name: wait-for-postgres
          image: {{ $waitImage | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: SQL_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $dsnSecretName }}
                  key: SQL_DSN
          command:
            - /bin/sh
            - -c
            - |
              echo "waiting for PostgreSQL to be ready..."
              until psql "$SQL_DSN" -tAc "SELECT 1" >/dev/null 2>&1; do
                sleep 5
              done
              echo "PostgreSQL is ready"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      {{- end }}
      containers:
        - name: cubeface
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ int (toString .Values.config.PORT) }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-config
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: SESSION_SECRET
            {{- if not $isSQLite }}
            - name: SQL_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $dsnSecretName }}
                  key: SQL_DSN
            {{- end }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: SMTP_PASSWORD
                  optional: true
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: GITHUB_CLIENT_SECRET
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: OIDC_CLIENT_SECRET
                  optional: true
            - name: INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: INITIAL_ADMIN_PASSWORD
                  optional: true
            {{- with .Values.envVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or $isSQLite .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if $isSQLite }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ include "cubeface.probePath" . | quote }}
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: {{ include "cubeface.probePath" . | quote }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ include "cubeface.probePath" . | quote }}
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      terminationGracePeriodSeconds: 30
      {{- if or $isSQLite .Values.extraVolumes }}
      volumes:
        {{- if $isSQLite }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "cubeface.pvcName" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
