apiVersion: v1
kind: Service
metadata:
  name: {{ include "medrouter.fullname" . }}
  labels:
    {{- include "medrouter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "medrouter.selectorLabels" (dict "root" . "component" "app") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
