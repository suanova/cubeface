{{- if and (eq (toString (default "postgres" .Values.database.mode)) "sqlite") .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "medrouter.pvcName" . }}
  labels:
    {{- include "medrouter.labels" . | nindent 4 }}
  {{- if .Values.persistence.retain }}
  annotations:
    # Keep the database volume when the release is uninstalled. Deleting a PVC
    # destroys all users and sessions, which should never be a side effect of
    # `helm uninstall`.
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
