<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>CubeFace</title>
    <meta name="title" content="CubeFace" />
    <meta
      name="description"
      content="CubeFace — an open platform for discovering, sharing, and running AI models."
    />
    <meta name="theme-color" content="#fff" />
    <script>
      ;(function () {
        try {
          var choice = localStorage.getItem('cubeface-theme') || 'light'
          var dark =
            choice === 'dark' ||
            (choice === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (_) {}
      })()
    </script>
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
