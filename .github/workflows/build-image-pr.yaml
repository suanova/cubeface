name: Image (Pull Request)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push preview image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: harbor.isuanova.com/suanova/medrouter
      # Secrets are not injected into fork/Dependabot runs. Build there, but
      # never attempt to log in or push.
      HAS_REGISTRY_CREDS: ${{ secrets.CI_BOT_PASSWORD != '' && vars.CI_BOT_NAME != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        if: env.HAS_REGISTRY_CREDS == 'true'
        uses: docker/login-action@v3
        with:
          registry: harbor.isuanova.com
          username: ${{ vars.CI_BOT_NAME }}
          password: ${{ secrets.CI_BOT_PASSWORD }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.HAS_REGISTRY_CREDS == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
