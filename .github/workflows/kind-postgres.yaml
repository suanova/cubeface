name: Kubernetes (KinD + CloudNativePG)

on:
  push:
    branches:
      - main
      - master
    paths:
      - "helm/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/kind-postgres.yaml"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - "hack/**"
      - "main.go"
  pull_request:
    paths:
      - "helm/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/kind-postgres.yaml"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - "hack/**"
      - "main.go"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kind-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart:
    name: Helm lint & render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Lint chart
        run: helm lint helm/cubeface-chart

      - name: Render the default managed PostgreSQL cluster
        run: |
          set -euo pipefail
          helm template cubeface helm/cubeface-chart > /tmp/default.yaml
          grep -q "kind: Cluster" /tmp/default.yaml
          grep -q "kind: Deployment" /tmp/default.yaml
          grep -q "cloudnative-pg" /tmp/default.yaml
          # The app must consume the generated DSN secret, never a SQLite path.
          grep -q "cubeface-postgres-dsn" /tmp/default.yaml
          if grep -q "SQLITE_PATH" /tmp/default.yaml; then
            echo "unexpected SQLITE_PATH in managed PostgreSQL mode"
            exit 1
          fi

      - name: Render model library RBAC
        run: |
          set -euo pipefail
          helm template cubeface helm/cubeface-chart > /tmp/models.yaml
          grep -q "kind: ServiceAccount" /tmp/models.yaml
          grep -q "kind: ClusterRole" /tmp/models.yaml
          grep -q "kind: ClusterRoleBinding" /tmp/models.yaml
          grep -q "modelversions" /tmp/models.yaml
          grep -q "inferenceruntimeprofiles" /tmp/models.yaml
          # The catalog only ever lists; the model-library ClusterRole must not
          # carry get/watch or any write verb.
          awk '
            /^kind: / { isRole = ($0 == "kind: ClusterRole") }
            { doc = doc $0 "\n" }
            /^---$/ {
              if (isRole && doc ~ /ai[.]cubestack[.]io/) print doc
              doc = ""
              isRole = 0
            }
            END { if (isRole && doc ~ /ai[.]cubestack[.]io/) print doc }
          ' /tmp/models.yaml > /tmp/model-library-role.yaml
          test -s /tmp/model-library-role.yaml
          grep -q -- "- list" /tmp/model-library-role.yaml
          if grep -Eq -- "^[[:space:]]+- (get|watch|create|update|patch|delete|deletecollection)$" /tmp/model-library-role.yaml; then
            echo "model library RBAC must stay list-only"
            exit 1
          fi
          awk '
            /^kind: / { isBinding = ($0 == "kind: ClusterRoleBinding") }
            { doc = doc $0 "\n" }
            /^---$/ {
              if (isBinding && doc ~ /model-library/) print doc
              doc = ""
              isBinding = 0
            }
            END { if (isBinding && doc ~ /model-library/) print doc }
          ' /tmp/models.yaml > /tmp/model-library-binding.yaml
          test -s /tmp/model-library-binding.yaml
          grep -q "kind: ClusterRoleBinding" /tmp/model-library-binding.yaml
          awk '
            /^kind: / { isSA = ($0 == "kind: ServiceAccount"); name = "" }
            isSA && /^  name: / { name = $0 }
            { doc = doc $0 "\n" }
            /^---$/ {
              if (isSA && name == "  name: cubeface") print doc
              doc = ""
              isSA = 0
            }
            END { if (isSA && name == "  name: cubeface") print doc }
          ' /tmp/models.yaml > /tmp/model-serviceaccount.yaml
          test -s /tmp/model-serviceaccount.yaml
          grep -q "^  name: cubeface$" /tmp/model-serviceaccount.yaml
          # The pod has to run as that account for the binding to apply.
          grep -q 'serviceAccountName: "cubeface"' /tmp/models.yaml
          grep -q "automountServiceAccountToken: true" /tmp/models.yaml
          grep -q 'MODEL_LIBRARY_ENABLED: "true"' /tmp/models.yaml

          # Disabling the library removes both the feature and its cluster RBAC.
          helm template cubeface helm/cubeface-chart --set modelLibrary.enabled=false > /tmp/models-disabled.yaml
          grep -q 'MODEL_LIBRARY_ENABLED: "false"' /tmp/models-disabled.yaml
          if grep -q "model-library" /tmp/models-disabled.yaml; then
            echo "model library RBAC must not render when the library is disabled"
            exit 1
          fi
          if grep -q "ai.cubestack.io" /tmp/models-disabled.yaml; then
            echo "unexpected CubeStack RBAC when the model library is disabled"
            exit 1
          fi

          # Opting out of RBAC keeps the app but lets operators manage access.
          helm template cubeface helm/cubeface-chart --set modelLibrary.rbac.create=false > /tmp/models-no-rbac.yaml
          grep -q 'MODEL_LIBRARY_ENABLED: "true"' /tmp/models-no-rbac.yaml
          if grep -q "ai.cubestack.io" /tmp/models-no-rbac.yaml; then
            echo "model library RBAC must not render with rbac.create=false"
            exit 1
          fi

      - name: Render SQLite with Ingress and base path
        run: |
          set -euo pipefail
          helm template cubeface helm/cubeface-chart \
            --set database.mode=sqlite \
            --set database.postgres.operator.install=false \
            --set config.BASE_PATH=/cubeface \
            --set ingress.enabled=true \
            --set 'ingress.hosts[0]=models.example.com' \
            --set ingress.tls.enabled=true \
            --set ingress.tls.secretName=models-tls \
            > /dev/null

      - name: Render external PostgreSQL with two replicas
        run: |
          set -euo pipefail
          helm template cubeface helm/cubeface-chart \
            --set database.mode=external \
            --set database.postgres.operator.install=false \
            --set-string 'database.external.dsn=postgres://u:p@db.example.com:5432/cubeface?sslmode=require' \
            --set replicaCount=2 \
            > /dev/null

      - name: Render with an external Secret
        run: |
          set -euo pipefail
          helm template cubeface helm/cubeface-chart \
            --set database.postgres.operator.install=false \
            --set secret.create=false \
            --set secret.existingSecret=cubeface-credentials \
            > /dev/null

      - name: Render backups and the PgBouncer pooler
        run: |
          set -euo pipefail
          helm template cubeface helm/cubeface-chart \
            --set database.postgres.operator.install=false \
            --set database.postgres.backups.enabled=true \
            --set database.postgres.pgBouncer.enabled=true \
            > /tmp/features.yaml
          grep -q "kind: ScheduledBackup" /tmp/features.yaml
          grep -q "kind: Pooler" /tmp/features.yaml

      - name: Reject unsafe configurations
        run: |
          set -euo pipefail
          reject() {
            if helm template invalid helm/cubeface-chart "$@" > /dev/null 2>&1; then
              echo "expected this configuration to be rejected: $*"
              exit 1
            fi
          }
          reject --set database.mode=sqlite --set database.postgres.operator.install=false --set replicaCount=2
          reject --set database.mode=external --set database.postgres.operator.install=false
          reject --set database.mode=bogus
          reject --set database.postgres.auth.username=Bad-User
          reject --set database.postgres.instances=0
          reject --set-string secrets.POSTGRES_PASSWORD='p@ss'
          reject --set database.postgres.backups.enabled=true --set database.postgres.backups.method=fileArchiving
          reject --set config.EMAIL_VERIFICATION_ENABLED=true
          reject --set config.extra.MODEL_LIBRARY_ENABLED=true
          reject --set modelLibrary.cacheTTLSeconds=0
          reject --set modelLibrary.requestTimeoutSeconds=0
          reject --set modelLibrary.rbac.create=true --set serviceAccount.create=false

  kind-postgres:
    name: Install on KinD with HA CloudNativePG
    needs: chart
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cubeface:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - uses: helm/kind-action@v1
        with:
          cluster_name: cubeface
          node_image: kindest/node:v1.31.0
          wait: 120s

      - name: Load image into KinD
        run: kind load docker-image cubeface:ci --name cubeface

      - name: Install CubeFace with its managed PostgreSQL cluster
        run: |
          set -euo pipefail
          kubectl create namespace cubeface
          helm install cubeface helm/cubeface-chart \
            --namespace cubeface \
            --set image.repository=cubeface \
            --set-string image.tag=ci \
            --set image.pullPolicy=Never \
            --set config.PUBLIC_ORIGIN=http://localhost:3000 \
            --set database.postgres.instances=3 \
            --set database.postgres.resources.requests.cpu=100m \
            --set database.postgres.resources.requests.memory=256Mi \
            --set database.postgres.resources.limits.cpu=1 \
            --set database.postgres.resources.limits.memory=1Gi \
            --timeout 15m
          # The app pod waits for the CNPG primary in its init container, so
          # this also covers the first bootstrap of a 3-instance cluster.
          kubectl -n cubeface rollout status deployment/cubeface --timeout=10m
          kubectl -n cubeface get pods -o wide

      - name: Verify the HA PostgreSQL cluster is ready
        run: |
          set -euo pipefail
          kubectl -n cubeface wait --for=condition=Ready cluster/cubeface-postgres --timeout=10m
          instances=$(kubectl -n cubeface get cluster cubeface-postgres -o jsonpath='{.status.instances}')
          ready=$(kubectl -n cubeface get cluster cubeface-postgres -o jsonpath='{.status.readyInstances}')
          primary=$(kubectl -n cubeface get cluster cubeface-postgres -o jsonpath='{.status.currentPrimary}')
          echo "instances=$instances ready=$ready primary=$primary"
          test "$instances" = "3"
          test "$ready" = "3"
          test -n "$primary"
          pods=$(kubectl -n cubeface get pods -l cnpg.io/cluster=cubeface-postgres --no-headers | wc -l)
          test "$pods" = "3"

      - name: Verify the app uses the managed PostgreSQL cluster
        run: |
          set -euo pipefail
          sqlite_path=$(kubectl -n cubeface get configmap cubeface-config -o jsonpath='{.data.SQLITE_PATH}')
          test -z "$sqlite_path"
          dsn=$(kubectl -n cubeface get secret cubeface-postgres-dsn -o jsonpath='{.data.SQL_DSN}' | base64 --decode)
          echo "dsn host: $(printf '%s' "$dsn" | sed -E 's#^[^@]*@##; s#/.*##')"
          printf '%s' "$dsn" | grep -q '^postgresql://'
          printf '%s' "$dsn" | grep -q '@cubeface-postgres-rw:5432/cubeface?sslmode=require'
          wait_image=$(kubectl -n cubeface get deployment cubeface -o jsonpath='{.spec.template.spec.initContainers[0].image}')
          echo "wait-for-postgres image: $wait_image"
          printf '%s' "$wait_image" | grep -q 'cloudnative-pg/postgresql'

      - name: Apply the CubeStack model catalog fixtures
        run: |
          set -euo pipefail
          kubectl apply -f hack/kind/model-catalog-crds.yaml
          kubectl wait --for=condition=Established \
            crd/modelversions.ai.cubestack.io \
            crd/inferenceruntimeprofiles.ai.cubestack.io \
            --timeout=120s
          kubectl apply -f hack/kind/model-catalog-fixtures.yaml
          kubectl get modelversions.ai.cubestack.io -o wide
          kubectl get inferenceruntimeprofiles.ai.cubestack.io -o wide

      - name: Verify CubeFace is reachable and uses PostgreSQL
        run: |
          set -euo pipefail
          kubectl -n cubeface port-forward svc/cubeface 3000:80 >/tmp/port-forward.log 2>&1 &
          echo $! > /tmp/port-forward.pid

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "port-forward did not become healthy"
              cat /tmp/port-forward.log
              exit 1
            fi
            sleep 1
          done

          echo "health:"
          curl -fsS http://127.0.0.1:3000/healthz | tee /tmp/health.json
          jq -e '.status == "ok"' /tmp/health.json >/dev/null

          echo "landing page:"
          curl -fsS http://127.0.0.1:3000/ | tee /tmp/index.html
          grep -q '<div id="root"' /tmp/index.html
          grep -q '<title>CubeFace</title>' /tmp/index.html
          curl -fsS http://127.0.0.1:3000/sign-in | grep -q '<div id="root"'

          echo "status:"
          curl -fsS http://127.0.0.1:3000/api/status | tee /tmp/status.json
          jq -e '.success == true' /tmp/status.json >/dev/null

          echo "register:"
          curl -fsS -X POST http://127.0.0.1:3000/api/user/register \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://localhost:3000' \
            -d '{"username":"ciuser","email":"ci@example.com","password":"CiPassw0rd"}' \
            | tee /tmp/register.json
          jq -e '.success == true and .data.user.username == "ciuser"' /tmp/register.json >/dev/null

          echo "login:"
          curl -fsS -c /tmp/cookies.txt -X POST http://127.0.0.1:3000/api/user/login \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://localhost:3000' \
            -d '{"username":"ciuser","password":"CiPassw0rd"}' \
            | tee /tmp/login.json
          jq -e '.success == true' /tmp/login.json >/dev/null

          echo "self:"
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3000/api/user/self \
            | tee /tmp/self.json
          jq -e '.success == true and .data.user.username == "ciuser"' /tmp/self.json >/dev/null

          # Query the primary directly: the account and its session must be
          # rows in the CNPG cluster, not in a local SQLite file.
          primary=$(kubectl -n cubeface get cluster cubeface-postgres -o jsonpath='{.status.currentPrimary}')
          users=$(kubectl -n cubeface exec "$primary" -c postgres -- \
            psql -U postgres -d cubeface -tAc "select count(*) from users where username = 'ciuser'" | tr -d '[:space:]')
          sessions=$(kubectl -n cubeface exec "$primary" -c postgres -- \
            psql -U postgres -d cubeface -tAc \
            "select count(*) from user_sessions where user_id = (select id from users where username = 'ciuser')" | tr -d '[:space:]')
          echo "postgres users=$users sessions=$sessions"
          test "$users" = "1"
          test "$sessions" -ge 1

      - name: Verify the model catalog reads CubeStack CRDs
        run: |
          set -euo pipefail
          # The catalog caches a CRD_MISSING result for a minute; poll until the
          # fixtures are picked up instead of racing the cache.
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:3000/api/models > /tmp/models.json || true
            if jq -e '.data.available == true and .data.total == 1' /tmp/models.json >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "model catalog did not become available"
              cat /tmp/models.json || true
              exit 1
            fi
            sleep 2
          done
          cat /tmp/models.json | jq .
          jq -e '
            .success == true and
            .data.available == true and
            .data.stale == false and
            .data.profiles_available == true and
            .data.total == 1 and
            .data.version_total == 2 and
            .data.profile_total == 1 and
            .data.models[0].model == "demo-model" and
            .data.models[0].display_name == "Demo Model" and
            .data.models[0].publisher == "CubeFace CI" and
            .data.models[0].publisher_initials == "CC" and
            .data.models[0].license == "Apache-2.0" and
            .data.models[0].task == "chat" and
            .data.models[0].featured == true and
            .data.models[0].latest_version == "v1.2.0" and
            .data.models[0].version_count == 2 and
            .data.models[0].compatible_profile_count == 1 and
            .data.models[0].used_by_count == 1 and
            (.data.models[0].description | startswith("Fixture model")) and
            (.data.models[0].tags | index("demo") != null)
          ' /tmp/models.json >/dev/null

          echo "detail:"
          curl -fsS http://127.0.0.1:3000/api/models/demo-model > /tmp/model-detail.json
          cat /tmp/model-detail.json | jq .
          jq -e '
            .data.available == true and
            .data.latest_ref == "demo-model-v1-2-0" and
            (.data.versions | length) == 2 and
            .data.versions[0].version == "v1.2.0" and
            .data.versions[0].is_latest == true and
            .data.versions[0].storage.strategy == "S3" and
            .data.versions[0].storage.uri_configured == true and
            .data.versions[0].storage.credentials_configured == true and
            (.data.versions[0].compatible_profiles | length) == 1 and
            (.data.compatible_profiles | length) == 1 and
            .data.compatible_profiles[0].name == "demo-qwen-bf16" and
            .data.compatible_profiles[0].engine.name == "vllm" and
            .data.compatible_profiles[0].gpu_per_pod == 4 and
            .data.compatible_profiles[0].serving_mode == "pd-separation" and
            (.data.compatible_profiles[0].compatible_versions | sort) == ["v1.1.0", "v1.2.0"]
          ' /tmp/model-detail.json >/dev/null

          # Lookups by ModelVersion metadata.name resolve to the same group.
          curl -fsS http://127.0.0.1:3000/api/models/demo-model-v1-1-0 \
            | jq -e '.data.model == "demo-model"' >/dev/null

          # Storage locations and credential names must never leave the cluster.
          if jq -e 'tojson | test("internal-bucket|internal-credentials|secret-root")' /tmp/model-detail.json >/dev/null; then
            echo "model detail leaked storage internals"
            exit 1
          fi

          status=$(curl -s -o /tmp/model-404.json -w '%{http_code}' \
            http://127.0.0.1:3000/api/models/no-such-model)
          test "$status" = "404"
          jq -e '.success == false and .code == "MODEL_NOT_FOUND"' /tmp/model-404.json >/dev/null

      - name: Verify the model catalog degrades without RBAC
        run: |
          set -euo pipefail
          binding=$(kubectl get clusterrolebinding \
            -l app.kubernetes.io/instance=cubeface,app.kubernetes.io/name=cubeface \
            -o jsonpath='{.items[0].metadata.name}')
          test -n "$binding"
          role=$(kubectl get clusterrolebinding "$binding" -o jsonpath='{.roleRef.name}')
          sa=$(kubectl -n cubeface get deployment cubeface \
            -o jsonpath='{.spec.template.spec.serviceAccountName}')
          echo "removing $binding (role $role, service account $sa)"
          kubectl delete clusterrolebinding "$binding"

          # Cached data stays available for the stale window, so allow enough
          # time for that window to expire before requiring FORBIDDEN.
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:3000/api/models > /tmp/models-forbidden.json || true
            if jq -e '.data.available == false and .data.reason == "FORBIDDEN"' /tmp/models-forbidden.json >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "model catalog did not report FORBIDDEN without RBAC"
              cat /tmp/models-forbidden.json || true
              exit 1
            fi
            sleep 2
          done
          cat /tmp/models-forbidden.json | jq .
          jq -e '
            .success == true and
            .data.available == false and
            .data.reason == "FORBIDDEN" and
            .data.retryable == true and
            (.data.models | length) == 0
          ' /tmp/models-forbidden.json >/dev/null

          kubectl create clusterrolebinding "$binding" \
            --clusterrole="$role" \
            --serviceaccount="cubeface:$sa"

          # And the catalog recovers once access is restored.
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/api/models > /tmp/models-restored.json || true
            if jq -e '.data.available == true and .data.total == 1' /tmp/models-restored.json >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "model catalog did not recover after RBAC was restored"
              cat /tmp/models-restored.json || true
              exit 1
            fi
            sleep 2
          done

      - name: Fail over the primary and verify CubeFace recovers
        run: |
          set -euo pipefail
          old_primary=$(kubectl -n cubeface get cluster cubeface-postgres -o jsonpath='{.status.currentPrimary}')
          echo "deleting primary pod $old_primary"
          kubectl -n cubeface delete pod "$old_primary" --wait=false

          new_primary=""
          for i in $(seq 1 120); do
            new_primary=$(kubectl -n cubeface get cluster cubeface-postgres -o jsonpath='{.status.currentPrimary}' 2>/dev/null || true)
            if [ -n "$new_primary" ] && [ "$new_primary" != "$old_primary" ]; then
              break
            fi
            sleep 2
          done
          echo "new primary: ${new_primary:-<none>}"
          test -n "$new_primary"
          test "$new_primary" != "$old_primary"

          for i in $(seq 1 150); do
            ready=$(kubectl -n cubeface get cluster cubeface-postgres -o jsonpath='{.status.readyInstances}' 2>/dev/null || true)
            if [ "$ready" = "3" ]; then
              break
            fi
            if [ "$i" -eq 150 ]; then
              echo "cluster did not return to 3 ready instances"
              kubectl -n cubeface get cluster cubeface-postgres -o yaml
              exit 1
            fi
            sleep 2
          done

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "CubeFace did not recover after the PostgreSQL failover"
              cat /tmp/port-forward.log || true
              exit 1
            fi
            sleep 2
          done

          users=$(kubectl -n cubeface exec "$new_primary" -c postgres -- \
            psql -U postgres -d cubeface -tAc "select count(*) from users where username = 'ciuser'" | tr -d '[:space:]')
          echo "postgres users after failover=$users"
          test "$users" = "1"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n cubeface get all -o wide || true
          kubectl -n cubeface get cluster -o yaml || true
          kubectl -n cubeface describe pods || true
          kubectl -n cubeface logs deployment/cubeface --all-containers --tail=200 || true
          kubectl -n cubeface logs deployment/cubeface-cloudnative-pg --tail=200 || true
          kubectl -n cubeface get events --sort-by=.lastTimestamp | tail -50 || true

      - name: Stop port-forward
        if: always()
        run: |
          if [ -f /tmp/port-forward.pid ]; then
            kill "$(cat /tmp/port-forward.pid)" 2>/dev/null || true
          fi
