# CubeStack objects used by the KinD workflow to verify the model and dataset
# libraries against a real Kubernetes API server. Apply
# model-catalog-crds.yaml first.
#
# The two ModelVersions share spec.model, so the catalog must collapse them
# into one entry, prefer the annotations of the newest version and report both
# versions as compatible with demo-qwen-bf16.
#
# The two Datasets share spec.dataset, so /api/datasets must collapse them the
# same way: latest v1.1.0, version_count 2, cluster-scoped lookups by either
# the semantic name or a metadata.name.
apiVersion: ai.cubestack.io/v1alpha1
kind: ModelVersion
metadata:
  name: demo-model-v1-1-0
  annotations:
    medrouter.io/display-name: Stale Display Name
spec:
  model: demo-model
  version: v1.1.0
  architecture: qwen2
  quantization: bf16
  storage:
    strategy: Dynamic
    dynamic:
      storageClassName: local-path
      capacity: 20Gi
status:
  usedBy:
    - namespace: demo
      name: demo-inference
  conditions:
    - type: StorageResolved
      status: "True"
      lastTransitionTime: "2026-01-02T00:10:00Z"
---
apiVersion: ai.cubestack.io/v1alpha1
kind: ModelVersion
metadata:
  name: demo-model-v1-2-0
  annotations:
    medrouter.io/display-name: Demo Model
    medrouter.io/publisher: MedRouter CI
    medrouter.io/task: chat
    medrouter.io/license: Apache-2.0
    medrouter.io/tags: demo, qwen2
    medrouter.io/usage-boundary: CI fixture only
    medrouter.io/featured: "true"
    ai.cubestack.io/description: Fixture model backed by two ModelVersions.
spec:
  model: demo-model
  version: v1.2.0
  architecture: qwen2
  quantization: bf16
  storage:
    strategy: S3
    s3:
      uri: s3://internal-bucket/secret-prefix/demo-model
      credentialsRef:
        name: internal-credentials
status:
  usedBy:
    - namespace: demo
      name: demo-inference
  rootPath: /var/lib/cubestack/secret-root
  conditions:
    - type: StorageResolved
      status: "True"
      lastTransitionTime: "2026-01-03T00:10:00Z"
---
apiVersion: ai.cubestack.io/v1alpha1
kind: InferenceRuntimeProfile
metadata:
  name: demo-qwen-bf16
  labels:
    inference.ai.cubestack.io/serving-mode: pd-separation
  annotations:
    ai.cubestack.io/description: CI runtime profile for the demo model.
spec:
  accelerator:
    vendor: nvidia
    models:
      - A100
  engine:
    name: vllm
    version: 0.6.3
  modelRequirements:
    architectures:
      - qwen2
    quantization:
      - bf16
  roles:
    - name: prefill
      podTemplate:
        resources:
          gpuPerPod: 2
    - name: decode
      podTemplate:
        resources:
          gpuPerPod: 4
status:
  usedBy:
    - namespace: demo
      name: demo-inference
  conditions:
    - type: AssetsResolved
      status: "True"
      lastTransitionTime: "2026-01-03T00:20:00Z"
---
apiVersion: ai.cubestack.io/v1alpha1
kind: Dataset
metadata:
  name: demo-dataset-v1-0-0
  annotations:
    ai.cubestack.io/description: First fixture version of the demo dataset.
spec:
  dataset: demo-dataset
  version: v1.0.0
  format: Parquet
  size: 1.0Gi
  recordCount: 100000
  storage:
    strategy: HostPath
    hostPath:
      path: /var/lib/cubestack/secret-root/demo-dataset
---
apiVersion: ai.cubestack.io/v1alpha1
kind: Dataset
metadata:
  name: demo-dataset-v1-1-0
  annotations:
    medrouter.io/display-name: Demo Dataset
    medrouter.io/publisher: MedRouter CI
    medrouter.io/task: sft
    medrouter.io/license: CC-BY-4.0
    medrouter.io/tags: demo, parquet
    medrouter.io/access: public
    medrouter.io/deidentification: PII removed
    medrouter.io/ethics: Internal review
    medrouter.io/source-repo: https://example.com/demo-dataset
    medrouter.io/usage-boundary: CI fixture only
    medrouter.io/featured: "true"
    ai.cubestack.io/description: Fixture dataset backed by two Dataset versions.
spec:
  dataset: demo-dataset
  version: v1.1.0
  format: Parquet
  size: 1.2Gi
  recordCount: 120000
  meta:
    language: en
  storage:
    strategy: S3
    s3:
      uri: s3://internal-bucket/secret-prefix/demo-dataset
      credentialsRef:
        name: internal-credentials
